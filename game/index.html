<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bearframe RPG · Sounding Ridge</title>
<style>
*{box-sizing:border-box}body{background:#11131a;color:#ece9f1;font:16px system-ui,sans-serif;margin:0}main{max-width:560px;margin:auto;padding:16px 16px 22px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #363543;padding-bottom:9px}small,.eyebrow{font:600 11px monospace;letter-spacing:.13em;color:#c2b1d5;text-transform:uppercase}h1,h2,p{margin:0}h1{font:500 clamp(27px,7vw,42px) Georgia,serif;letter-spacing:-.025em}h2{font:500 25px Georgia,serif;margin:7px 0}#portrait{width:34%;max-width:145px;border-radius:3px;float:right;margin:0 0 8px 12px}#intro{padding-top:16px}#intro p{color:#d4cdd7;line-height:1.45;margin:10px 0}form{clear:both;display:grid;gap:10px;padding-top:12px}label{display:grid;gap:4px;color:#d8d2df}button,input,select{font:inherit;border:1px solid #5e596a;border-radius:5px;background:#242530;color:#f5f0fe;padding:9px 12px;min-height:44px}button{touch-action:manipulation;cursor:pointer}button:active{background:#4c445e}button:disabled{opacity:.45}.primary{background:#cbb9e6;color:#211b29;font-weight:650}#top{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px}canvas{width:100%;image-rendering:pixelated;border:1px solid #595361;border-radius:4px;background:#292637}#stats,#objective{font:13px/1.5 monospace;color:#cec6d6;margin:5px 0}#story{border-left:3px solid #aa93ca;padding:8px 12px;margin:10px 0;line-height:1.45;background:#1c1d26}#choices{display:flex;flex-wrap:wrap;gap:7px}#pad{display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center;margin:10px 0}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#notice{font-size:13px;color:#efb78b}button:focus-visible{outline:3px solid #d1baf6}[hidden]{display:none!important}
</style></head><body><main><header><small>Bearframe Labs</small><small>Surface expedition</small></header>
<section id="intro"><img id="portrait" src="sleeper.webp" alt="Weathered Sleeper Frame with a violet visor"><small>Bearframe RPG</small><h1>Sounding Ridge</h1><p>Beneath the orbital city, a Guardian keeps watch beside the buried stasis berths. One visor is waking.</p>
<form id="create"><label>Chosen name<input id="callsign" maxlength="18" placeholder="Sleeper" autocomplete="off"></label><label>Chassis finish<select id="finish"><option>Ash</option><option>Slate</option><option>Ivory</option></select></label><button class="primary">Awaken</button></form></section>
<section id="play" hidden><div id="top"><h2 id="place"></h2><small id="mode"></small></div><canvas width="296" height="202" aria-label="Expedition field"></canvas><div id="stats"></div><div id="objective"></div><p id="story" aria-live="polite"></p><div id="choices"></div><div id="pad"><button aria-label="Move north" data-dir="up">▲</button><button aria-label="Move west" data-dir="left">◀︎</button><button aria-label="Move south" data-dir="down">▼</button><button aria-label="Move east" data-dir="right">▶︎</button></div></section><div id="notice" role="status"></div></main>
<script src="world.js"></script><script src="engine.js"></script><script src="draw.js"></script><script src="ui.js"></script></body></html>
