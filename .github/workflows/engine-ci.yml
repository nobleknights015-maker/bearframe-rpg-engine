name: Bearframe engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-tests:
    name: Runtime and content contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard public source repository against ROMs and secrets
        run: python3 scripts/check_repository_hygiene.py
      - name: Verify source syntax
        run: |
          set -euo pipefail
          for file in game/*.js android/*.js tests/*.js; do node --check "$file"; done
      - name: Run engine regressions and validate content
        run: node --test tests/*.test.js
  android-build:
    name: Clean Android source build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner has no Android SDK}"
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install pinned TypeScript and Rhino
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.7.15/rhino-1.7.15.jar -o "$RUNNER_TEMP/rhino.jar"
          echo '2427fdcbc149ca0a25ccfbb7c71b01f39ad42708773a47816cd2342861766b63  '"$RUNNER_TEMP/rhino.jar" | sha256sum -c -
      - name: Run the Android JavaScript simulation under Rhino
        shell: bash
        run: |
          set -euo pipefail
          export TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript/lib/typescript.js"
          node android/compile.js "$RUNNER_TEMP/simulation.js"
          java -cp "$RUNNER_TEMP/rhino.jar" org.mozilla.javascript.tools.shell.Main -version 200 -f "$RUNNER_TEMP/simulation.js" -f tests/native-adapter.js | tee "$RUNNER_TEMP/rhino-native-test.log"
          grep -q 'PASS native adapter expedition' "$RUNNER_TEMP/rhino-native-test.log"
      - name: Run standalone JRPG engine kit under Rhino
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/rhino.jar" org.mozilla.javascript.tools.shell.Main -version 200 -f framework/schema.js -f framework/runtime.js -f framework/save-slots.js -f framework/scene.js -f framework/session.js -f framework/audio.js -f framework/party-combat.js -f framework/viewport.js -f framework/performance.js -f framework/window-layout.js -f framework/save-migrations.js -f framework/asset-manifest.js -f fixtures/engine-project.js -f tests/framework-rhino.js | tee "$RUNNER_TEMP/framework-rhino-test.log"
          grep -q 'PASS portable JRPG framework' "$RUNNER_TEMP/framework-rhino-test.log"
      - name: Generate disposable build-only signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/ci-only.p12" -alias ci -keyalg RSA -keysize 2048 -validity 1 -storepass android-ci -keypass android-ci -dname 'CN=CI temporary build'
      - name: Build and verify Android APK and instrumentation package
        shell: bash
        env:
          BF_KEY_PASS: android-ci
        run: |
          set -euo pipefail
          export RHINO_JAR="$RUNNER_TEMP/rhino.jar"
          export TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript/lib/typescript.js"
          export SIGNING_KEY="$RUNNER_TEMP/ci-only.p12"
          bash android/build.sh "$RUNNER_TEMP/bearframe-ci.apk"
          bash android/test/build.sh "$RUNNER_TEMP/route-test-ci.apk"
          test -s "$RUNNER_TEMP/bearframe-ci.apk"
          test -s "$RUNNER_TEMP/route-test-ci.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/bearframe-ci.apk"
          sha256sum "$RUNNER_TEMP/bearframe-ci.apk"
      - name: Enable KVM for Android emulator
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed-app two-process recovery on Android emulator
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          ram-size: 1536M
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "$RUNNER_TEMP/bearframe-ci.apk"
            adb install -r "$RUNNER_TEMP/route-test-ci.apk"
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/native-stage-one.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS first' "$RUNNER_TEMP/native-stage-one.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/native-stage-one.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/native-stage-two.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS second' "$RUNNER_TEMP/native-stage-two.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/native-stage-two.txt"
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage controller dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/gamepad-controller.txt"
            grep -F 'route=PASS controller' "$RUNNER_TEMP/gamepad-controller.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/gamepad-controller.txt"
            # Decode the actual packaged WAV through Chromium's media stack.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-audio dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-audio.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-audio' "$RUNNER_TEMP/unified-audio.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-audio.txt"
            # The new engine runs in a separate offline WebView Activity,
            # using the portable simulation and synchronous native save bridge.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-first' "$RUNNER_TEMP/unified-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-second' "$RUNNER_TEMP/unified-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-second.txt"
      - name: Publish non-release test APKs
        uses: actions/upload-artifact@v4
        with:
          name: bearframe-android-ci-build
          path: |
            ${{ runner.temp }}/bearframe-ci.apk
            ${{ runner.temp }}/route-test-ci.apk
          if-no-files-found: error
          retention-days: 7
