name: Bearframe engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-tests:
    name: Runtime and content contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source syntax
        run: |
          set -euo pipefail
          for file in game/*.js android/*.js tests/*.js; do node --check "$file"; done
      - name: Run engine regressions and validate content
        run: node --test tests/*.test.js
  android-build:
    name: Clean Android source build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner has no Android SDK}"
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install pinned TypeScript and Rhino
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.7.15/rhino-1.7.15.jar -o "$RUNNER_TEMP/rhino.jar"
          echo '2427fdcbc149ca0a25ccfbb7c71b01f39ad42708773a47816cd2342861766b63  '"$RUNNER_TEMP/rhino.jar" | sha256sum -c -
      - name: Run the Android JavaScript simulation under Rhino
        shell: bash
        run: |
          set -euo pipefail
          export TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript/lib/typescript.js"
          node android/compile.js "$RUNNER_TEMP/simulation.js"
          java -cp "$RUNNER_TEMP/rhino.jar" org.mozilla.javascript.tools.shell.Main -version 200 -f "$RUNNER_TEMP/simulation.js" -f tests/native-adapter.js | tee "$RUNNER_TEMP/rhino-native-test.log"
          grep -q 'PASS native adapter expedition' "$RUNNER_TEMP/rhino-native-test.log"
      - name: Generate disposable build-only signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/ci-only.p12" -alias ci -keyalg RSA -keysize 2048 -validity 1 -storepass android-ci -keypass android-ci -dname 'CN=CI temporary build'
      - name: Build and verify Android APK and instrumentation package
        shell: bash
        env:
          BF_KEY_PASS: android-ci
        run: |
          set -euo pipefail
          export RHINO_JAR="$RUNNER_TEMP/rhino.jar"
          export TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript/lib/typescript.js"
          export SIGNING_KEY="$RUNNER_TEMP/ci-only.p12"
          bash android/build.sh "$RUNNER_TEMP/bearframe-ci.apk"
          bash android/test/build.sh "$RUNNER_TEMP/route-test-ci.apk"
          test -s "$RUNNER_TEMP/bearframe-ci.apk"
          test -s "$RUNNER_TEMP/route-test-ci.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/bearframe-ci.apk"
          sha256sum "$RUNNER_TEMP/bearframe-ci.apk"
      - name: Publish non-release test APKs
        uses: actions/upload-artifact@v4
        with:
          name: bearframe-android-ci-build
          path: |
            ${{ runner.temp }}/bearframe-ci.apk
            ${{ runner.temp }}/route-test-ci.apk
          if-no-files-found: error
          retention-days: 7
