name: Bearframe engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-tests:
    name: Runtime and content contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard public source repository against ROMs and secrets
        run: python3 scripts/check_repository_hygiene.py
      - name: Verify source syntax
        run: |
          set -euo pipefail
          for file in game/*.js android/*.js enginehost/*.js tests/*.js; do node --check "$file"; done
      - name: Run engine regressions and validate content
        run: node --test tests/*.test.js
  android-build:
    name: Clean Android source build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner has no Android SDK}"
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install pinned TypeScript and Rhino
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.3
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.7.15/rhino-1.7.15.jar -o "$RUNNER_TEMP/rhino.jar"
          echo '2427fdcbc149ca0a25ccfbb7c71b01f39ad42708773a47816cd2342861766b63  '"$RUNNER_TEMP/rhino.jar" | sha256sum -c -
      - name: Run the Android JavaScript simulation under Rhino
        shell: bash
        run: |
          set -euo pipefail
          export TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript/lib/typescript.js"
          node android/compile.js "$RUNNER_TEMP/simulation.js"
          java -cp "$RUNNER_TEMP/rhino.jar" org.mozilla.javascript.tools.shell.Main -version 200 -f "$RUNNER_TEMP/simulation.js" -f tests/native-adapter.js | tee "$RUNNER_TEMP/rhino-native-test.log"
          grep -q 'PASS native adapter expedition' "$RUNNER_TEMP/rhino-native-test.log"
      - name: Run standalone JRPG engine kit under Rhino
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/rhino.jar" org.mozilla.javascript.tools.shell.Main -version 200 -f framework/schema.js -f framework/content-contract.js -f framework/runtime.js -f framework/save-slots.js -f framework/character-sprites.js -f framework/scene.js -f framework/map-actors.js -f framework/pathfinding.js -f framework/session.js -f framework/audio.js -f framework/party-combat.js -f framework/progression.js -f framework/party-runtime.js -f framework/viewport.js -f framework/performance.js -f framework/window-layout.js -f framework/save-migrations.js -f framework/asset-manifest.js -f fixtures/engine-project.js -f fixtures/party-engine-project.js -f tests/framework-rhino.js -f tests/party-rhino.js | tee "$RUNNER_TEMP/framework-rhino-test.log"
          grep -q 'PASS portable JRPG framework' "$RUNNER_TEMP/framework-rhino-test.log"
          grep -q 'PASS opt-in party runtime Rhino' "$RUNNER_TEMP/framework-rhino-test.log"
      - name: Generate disposable build-only signing key
        shell: bash
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/ci-only.p12" -alias ci -keyalg RSA -keysize 2048 -validity 1 -storepass android-ci -keypass android-ci -dname 'CN=CI temporary build'
      - name: Build a deterministic synthetic asset-pack integration fixture
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP" <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const root=process.argv[2];
          const source=path.join(root,'bf-asset-source');
          const nested=path.join(source,'diagnostic');
          fs.mkdirSync(nested,{recursive:true});
          const png=Buffer.from(fs.readFileSync('enginehost/fixtures/terrain.png.b64','utf8').trim(),'base64');
          fs.writeFileSync(path.join(nested,'test.png'),png);
          const manifest={version:1,assets:{test:{type:'atlas',path:'diagnostic/test.png',
            width:png.readUInt32BE(16),height:png.readUInt32BE(20),preload:true}}};
          require('./scripts/package_assets')(manifest,source,path.join(root,'bf-asset-pack'));
          require('./scripts/verify_asset_pack')(path.join(root,'bf-asset-pack'));
          NODE
      - name: Build and verify Android APK and instrumentation package
        shell: bash
        env:
          BF_KEY_PASS: android-ci
        run: |
          set -euo pipefail
          export RHINO_JAR="$RUNNER_TEMP/rhino.jar"
          export TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript/lib/typescript.js"
          export SIGNING_KEY="$RUNNER_TEMP/ci-only.p12"
          export BF_ASSET_PACK_DIR="$RUNNER_TEMP/bf-asset-pack"
          bash android/build.sh "$RUNNER_TEMP/bearframe-ci.apk"
          BF_ENGINE_PREVIEW=1 bash android/build.sh "$RUNNER_TEMP/bearframe-engine-preview.apk"
          bash android/test/build.sh "$RUNNER_TEMP/route-test-ci.apk"
          # The preview is a separate package and its launcher explicitly
          # targets UnifiedEngineActivity (not the original Rhino launcher).
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$RUNNER_TEMP/bearframe-engine-preview.apk" | tee "$RUNNER_TEMP/preview-badging.txt"
          grep -F "package: name='dev.bearframe.ridge.preview'" "$RUNNER_TEMP/preview-badging.txt"
          grep -F "launchable-activity: name='dev.bearframe.ridge.UnifiedEngineActivity'" "$RUNNER_TEMP/preview-badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/bearframe-engine-preview.apk"
          test -s "$RUNNER_TEMP/bearframe-ci.apk"
          test -s "$RUNNER_TEMP/route-test-ci.apk"
          # The verified custom asset-pack actually made it inside the APK;
          # no narrative/game art has been introduced into the test bundle.
          unzip -p "$RUNNER_TEMP/bearframe-ci.apk" \
            assets/enginehost/packs/active/asset-index.json | grep -q '"test"'
          unzip -p "$RUNNER_TEMP/bearframe-ci.apk" \
            assets/enginehost/packs/active/diagnostic/test.png | sha256sum | \
            grep -q '^eaaae7e1a33e854df437f592ea0cc98e530e8b955172ae47b75406378e4ea179 '
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/bearframe-ci.apk"
          sha256sum "$RUNNER_TEMP/bearframe-ci.apk"
      - name: Build a separate opt-in owner-profile APK (synthetic CI art only)
        shell: bash
        env:
          BF_KEY_PASS: android-ci
        run: |
          set -euo pipefail
          export RHINO_JAR="$RUNNER_TEMP/rhino.jar"
          export TYPESCRIPT_PATH="$GITHUB_WORKSPACE/node_modules/typescript/lib/typescript.js"
          export SIGNING_KEY="$RUNNER_TEMP/ci-only.p12"
          export BF_ASSET_PACK_DIR="$RUNNER_TEMP/bf-asset-pack"
          export BF_CONTENT_PROFILE_JSON="$RUNNER_TEMP/ci-content-profile.json"
          node - "$BF_ASSET_PACK_DIR" "$BF_CONTENT_PROFILE_JSON" <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const pack=process.argv[2],input=JSON.parse(fs.readFileSync(path.join(pack,'asset-manifest.json'),'utf8'));
          const atlas=input.assets.test;
          if(!atlas||atlas.width!==64||atlas.height!==32)throw Error('Invalid CI source atlas');
          const frame=x=>({atlas:'test',x:x,y:0,w:32,h:32});
          const profile={version:1,
            manifest:{version:1,assets:{test:{...atlas,path:'enginehost/packs/active/'+atlas.path,preload:false}}},
            theme:{tileSize:32,clearColor:'#101018',
              atlases:{test:{width:64,height:32}},
              tiles:{floor:frame(32),wall:frame(0)},
              sprites:{player:{ticksPerFrame:2,directions:{
                down:{idle:frame(0),walk:[frame(32),frame(0)]},
                left:{idle:frame(32),walk:[frame(0),frame(32)]},
                right:{idle:frame(0),walk:[frame(32),frame(0)]},
                up:{idle:frame(32),walk:[frame(0),frame(32)]}}},
                eventMarker:{ticksPerFrame:1,frames:[frame(0)]}},
              eventSprites:{supply:'eventMarker',mechanic:'eventMarker',scout:'eventMarker'}},
            requiredImages:['test']};
          fs.writeFileSync(path.join(path.dirname(pack),'art-profile.json'),JSON.stringify(profile));
          const authored=JSON.parse(JSON.stringify(require('./fixtures/party-world-project.js')));
          authored.id='ci-external-content';authored.contentRevision='ci_content_1';
          fs.writeFileSync(process.argv[3],JSON.stringify({version:1,project:authored}));
          NODE
          bash android/build.sh "$RUNNER_TEMP/bearframe-owner-art-ci.apk"
          unzip -p "$RUNNER_TEMP/bearframe-owner-art-ci.apk" assets/enginehost/art-profile.js |
            grep -q 'var BEARFRAME_OWNER_ART_PROFILE ='
          unzip -p "$RUNNER_TEMP/bearframe-owner-art-ci.apk" assets/enginehost/content-profile.js |
            grep -q 'ci-external-content'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/bearframe-owner-art-ci.apk"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run installed-app two-process recovery on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          ram-size: 1536M
          disable-animations: true
          script: |
            set -euo pipefail
            # Preview can coexist with the original package; both must
            # install and its WebView engine must be launchable by the user.
            adb install -r "$RUNNER_TEMP/bearframe-ci.apk"
            adb install -r "$RUNNER_TEMP/bearframe-engine-preview.apk"
            adb shell am start -W -n dev.bearframe.ridge.preview/dev.bearframe.ridge.UnifiedEngineActivity | tee "$RUNNER_TEMP/preview-launch.txt"
            grep -F 'Status: ok' "$RUNNER_TEMP/preview-launch.txt"
            adb shell am force-stop dev.bearframe.ridge.preview
            adb install -r "$RUNNER_TEMP/route-test-ci.apk"
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/native-stage-one.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS first' "$RUNNER_TEMP/native-stage-one.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/native-stage-one.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/native-stage-two.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS second' "$RUNNER_TEMP/native-stage-two.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/native-stage-two.txt"
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage controller dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/gamepad-controller.txt"
            grep -F 'route=PASS controller' "$RUNNER_TEMP/gamepad-controller.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/gamepad-controller.txt"
            # Exercise optional verified asset pack inside the *installed*
            # restricted WebView, not just APK zip entry presence.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-pack dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-pack.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-pack' "$RUNNER_TEMP/unified-pack.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-pack.txt"
            # Exercise read-only transport from the original ExpeditionActivity
            # preferences file; never run a writeback or migration here.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-legacy dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-legacy.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-legacy' "$RUNNER_TEMP/unified-legacy.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-legacy.txt"
            # Verify deliberate archival of original Rhino bytes into a separate
            # crash-resistant vault, with restart readback and old save intact.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-archive-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-archive-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-archive-first' "$RUNNER_TEMP/unified-archive-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-archive-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-archive-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-archive-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-archive-second' "$RUNNER_TEMP/unified-archive-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-archive-second.txt"
            # Simulate SAF document result with an app-private test URI: actual
            # exported JSON must round-trip byte-identically to empty old slot.
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-archive-file dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-archive-file.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-archive-file' "$RUNNER_TEMP/unified-archive-file.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-archive-file.txt"
            # Refuse overwrite of existing legacy preferences when restoring a
            # user-selected, strictly validated historical JSON backup.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-restore-native dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-restore-native.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-restore-native' "$RUNNER_TEMP/unified-restore-native.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-restore-native.txt"
            # Verify deliberate legacy archive+playable import, original-rule combat,
            # and exact separate save recovery after killing the Android process.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-compat-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-compat-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-compat-first' "$RUNNER_TEMP/unified-compat-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-compat-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-compat-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-compat-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-compat-second' "$RUNNER_TEMP/unified-compat-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-compat-second.txt"
            # Export the latest advanced historical journal state to a document
            # and recover it into the old namespace ONLY when its key is missing.
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-compat-export dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-compat-export.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-compat-export' "$RUNNER_TEMP/unified-compat-export.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-compat-export.txt"
            # Fresh-install recovery of an exported historical JSON through
            # the actual native document stream and WebView consent. Android
            # process is killed before exact original-rule battle resume.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-compat-file-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/compat-file-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-compat-file-first' "$RUNNER_TEMP/compat-file-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/compat-file-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            # Reinstalling the same signed APK with -r preserves app data.
            # This exercises the PackageManager replacement path in addition
            # to the force-stop restart path (not a real version upgrade).
            adb install -r "$RUNNER_TEMP/bearframe-ci.apk"
            adb shell am instrument -w -e stage unified-compat-file-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/compat-file-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-compat-file-second' "$RUNNER_TEMP/compat-file-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/compat-file-second.txt"
            # Reproduce phone report: right direction appears stuck because
            # the world needs an event choice or an encounter command. Both
            # controls now appear immediately after the map, with explicit
            # save verification and saved combat resume across process death.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-mobile-flow-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/mobile-flow-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-mobile-flow-first' "$RUNNER_TEMP/mobile-flow-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/mobile-flow-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-mobile-flow-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/mobile-flow-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-mobile-flow-second' "$RUNNER_TEMP/mobile-flow-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/mobile-flow-second.txt"
            # Scripted world choice, inventory equipment, and quest display
            # run in the installed offline WebView against the canonical
            # save-before-render engine, then resume after process termination.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-inventory-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-inventory-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-inventory-first' "$RUNNER_TEMP/unified-inventory-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-inventory-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-inventory-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-inventory-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-inventory-second' "$RUNNER_TEMP/unified-inventory-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-inventory-second.txt"
            # Exercise the versioned party-combat core and UI through the
            # installed WebView, including process-stop journal recovery.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-party-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-party-first' "$RUNNER_TEMP/unified-party-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-party-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/unified-party-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-party-second' "$RUNNER_TEMP/unified-party-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/unified-party-second.txt"
            # Opt-in progression is part of the canonical saved party runtime:
            # test skill unlocks, actual growth, and two-process native recovery.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-level-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/level-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-level-first' "$RUNNER_TEMP/level-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/level-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-level-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/level-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-level-second' "$RUNNER_TEMP/level-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/level-second.txt"
            # Installed Android WebView: visible v2 world navigation, inventory,
            # combat/XP progression, durable journal and process restart.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-world-ui-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/party-world-ui-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-party-world-ui-first' "$RUNNER_TEMP/party-world-ui-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/party-world-ui-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-world-ui-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/party-world-ui-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-party-world-ui-second' "$RUNNER_TEMP/party-world-ui-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/party-world-ui-second.txt"
            # Verify real packaged PNG pixels from the integrated v2 scene,
            # navigation/scene synchronization, and forced-process recovery.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-world-canvas-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/party-world-canvas-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-party-world-canvas-first' "$RUNNER_TEMP/party-world-canvas-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/party-world-canvas-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-world-canvas-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/party-world-canvas-second.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-party-world-canvas-second' "$RUNNER_TEMP/party-world-canvas-second.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/party-world-canvas-second.txt"
            # Native Android memory trim: both v1 and v2 canvases must reload
            # packaged atlases without altering either journal.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-world-memory dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/party-world-memory.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-party-world-memory' "$RUNNER_TEMP/party-world-memory.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/party-world-memory.txt"
            # Real installed WebView synthetic party route with recruitment,
            # shared inventory transfers, ally XP and process-death recovery.
            adb shell pm clear dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-world-recruit-first dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/party-world-recruit-first.txt"
            grep -F 'INSTRUMENTATION_RESULT: route=PASS unified-party-world-recruit-first' "$RUNNER_TEMP/party-world-recruit-first.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/party-world-recruit-first.txt"
            adb shell am force-stop dev.bearframe.ridge
            adb shell am instrument -w -e stage unified-party-world-recruit-second dev.bearframe.ridge.tests/.RouteRunner | tee "$RUNNER_TEMP/party-world-recruit-second.txt"
